<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0810" />
    <!--
      iOS home-screen install. Safari ignores the manifest's `display` on
      older versions, so this is what actually removes the browser chrome.
      `black-translucent` lets content run under the status bar, which is
      what the existing --sat safe-area padding already compensates for —
      on the web path --sat resolves via env(safe-area-inset-top), since
      Capacitor's injected variable only exists inside the native shell.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life Mentor" />
    <title>Life Mentor</title>
    <!--
      Applies the theme BEFORE first paint.

      Dark mode lives in IndexedDB, which is async, so the .dark class used to
      land only after Dexie resolved — every cold start flashed light first.
      localStorage is synchronous and readable here; it is a MIRROR, written
      from the Dexie-derived value in useDarkMode, never a second source of
      truth. If it is ever stale, Dexie corrects it within one frame.
    -->
    <script>
      (function () {
        var on = true; // matches the app's default
        try {
          var v = localStorage.getItem("lm-dark");
          if (v !== null) on = v === "1";
        } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle("dark", on);
        root.style.colorScheme = on ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", on ? "#0a0810" : "#f6f5f8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
