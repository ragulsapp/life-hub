name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish the Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # capacitor-android's Gradle modules target Java 21
          cache: gradle

      # `npm ci` requires the lockfile to exactly match package.json for the
      # CURRENT platform. sharp (pulled in by @capacitor/assets) has
      # per-OS optional binaries, and a lockfile committed from Windows
      # doesn't record the Linux-only optional deps npm ci demands here.
      # `npm install` resolves them correctly instead.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" life-hub-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-hub-debug-apk
          path: life-hub-debug.apk

      # A rolling "latest" Release gives a single, stable, direct-tap .apk
      # link you can bookmark on your phone — no zip, no GitHub Actions UI.
      - name: Publish rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Life Hub (Android, debug build)"
          body: |
            Automatically rebuilt from the latest commit on `main`.
            Debug build — sideload only (not signed for the Play Store).

            **On your phone:** tap `life-hub-debug.apk` below to download, then open it to install (Android will ask you to allow installs from this source once).
          files: life-hub-debug.apk
          prerelease: true
