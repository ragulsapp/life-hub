name: Deploy PWA to Pages

# The iPhone path. iOS cannot install the APK and building a native iOS app
# needs a Mac, so the installable-on-iPhone build is the PWA: open the Pages
# URL in Safari, then Share -> Add to Home Screen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy, but don't queue up redundant ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --run

      - name: Build web app
        # A project Pages site is served from /<repo>/, so the bundle has to
        # be built with that prefix. The Android build deliberately does NOT
        # set this and stays at "/" — see the comment in vite.config.ts.
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA + Jekyll guards
        # 404.html: Pages has no SPA rewrite, so a hard refresh on any deep
        # path would 404. Serving index.html for it lets the app boot anyway.
        # .nojekyll: without it Pages drops files/folders beginning with an
        # underscore, which silently breaks some emitted assets.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        # Turns Pages on for the repo on the first run, so this needs no
        # click-through in repo settings before it can deploy.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
